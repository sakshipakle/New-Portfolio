# ===================================================================
# Spring Boot Server Configuration
# ===================================================================
server.port=8080
spring.application.name=portfolio-backend

# ===================================================================
# MySQL Database Connection Settings
# Configurable via environment variables (DB_URL, DB_USERNAME, DB_PASSWORD)
# Default values provided for standard local development
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ddl-auto=update automatically creates/updates tables on startup
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# JSON Serialization
# ===================================================================
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# Logging
# ===================================================================
logging.level.root=INFO
logging.level.com.portfolio.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
