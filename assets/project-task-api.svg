<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091424"/>
      <stop offset="100%" stop-color="#0f223d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="12" fill="url(#bgTask)"/>
  
  <!-- Window Header -->
  <rect width="600" height="40" rx="12" fill="#060c17"/>
  <circle cx="25" cy="20" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="42" cy="20" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="59" cy="20" r="5" fill="#10b981" opacity="0.8"/>
  <text x="300" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Task Management REST API • Postman &amp; Swagger Schema</text>

  <!-- Left: Endpoints tree -->
  <rect x="25" y="60" width="160" height="235" rx="8" fill="#0d1b30" stroke="#1b2e4b" stroke-width="1"/>
  <text x="38" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">ENDPOINTS</text>
  
  <rect x="35" y="100" width="34" height="16" rx="4" fill="#10b981" opacity="0.2"/>
  <text x="52" y="112" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">GET</text>
  <text x="75" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">/api/tasks</text>

  <rect x="35" y="130" width="38" height="16" rx="4" fill="#0066ff" opacity="0.2"/>
  <text x="54" y="142" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#00d2ff" text-anchor="middle">POST</text>
  <text x="79" y="142" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">/api/tasks</text>

  <rect x="35" y="160" width="34" height="16" rx="4" fill="#f59e0b" opacity="0.2"/>
  <text x="52" y="172" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#f59e0b" text-anchor="middle">PUT</text>
  <text x="75" y="172" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">/api/tasks/{id}</text>

  <rect x="35" y="190" width="34" height="16" rx="4" fill="#ef4444" opacity="0.2"/>
  <text x="52" y="202" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#ef4444" text-anchor="middle">DEL</text>
  <text x="75" y="202" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">/api/tasks/{id}</text>

  <!-- Right: JSON Payload Mock -->
  <rect x="200" y="60" width="375" height="235" rx="8" fill="#070e1c" stroke="#162744" stroke-width="1"/>
  <text x="220" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">// Response 200 OK • Content-Type: application/json</text>
  <text x="220" y="115" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">{</text>
  <text x="240" y="138" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00d2ff">"status"<span fill="#cbd5e1">: </span><span fill="#10b981">"SUCCESS"</span><span fill="#cbd5e1">,</span></text>
  <text x="240" y="161" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00d2ff">"taskId"<span fill="#cbd5e1">: </span><span fill="#f59e0b">204</span><span fill="#cbd5e1">,</span></text>
  <text x="240" y="184" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00d2ff">"title"<span fill="#cbd5e1">: </span><span fill="#94a3b8">"Sprint Planning API Review"</span><span fill="#cbd5e1">,</span></text>
  <text x="240" y="207" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00d2ff">"priority"<span fill="#cbd5e1">: </span><span fill="#10b981">"HIGH"</span><span fill="#cbd5e1">,</span></text>
  <text x="240" y="230" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00d2ff">"completed"<span fill="#cbd5e1">: </span><span fill="#38bdf8">false</span></text>
  <text x="220" y="253" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">}</text>

  <!-- Status Bar -->
  <rect x="200" y="265" width="375" height="30" rx="0" fill="#0c172a"/>
  <circle cx="215" cy="280" r="4" fill="#10b981"/>
  <text x="226" y="284" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">HTTP 200 OK</text>
  <text x="320" y="284" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">Time: 42ms</text>
  <text x="410" y="284" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">Size: 420 B</text>
</svg>
